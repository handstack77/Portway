services:
  distribution:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Distribution__ApiKey: ${PORTWAY_PUBLISH_KEY:?Set a random 32+ character PORTWAY_PUBLISH_KEY}
      Distribution__DataPath: /data
    volumes:
      - releases:/data
volumes:
  releases:
